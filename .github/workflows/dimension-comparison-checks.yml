name: Dimension comparison checks (#225)

on:
  push:
    branches:
      - feat/225-dimension-comparison-20261113
  pull_request:
    branches:
      - fix/225-ordered-dimensions-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Verify session handoff
        run: python scripts/verify_session_handoff.py
      - name: Run canonical unittest suite
        run: python -m unittest discover -s tests -v
