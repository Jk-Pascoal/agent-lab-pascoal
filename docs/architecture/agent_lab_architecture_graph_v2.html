<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Lab Architecture Graph · V2</title><script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script><script src="agent_lab_architecture_graph_v2_data.js"></script><style>:root{--bg:#0b0e13;--panel:#111621;--border:#232b3b;--text:#dce3f0;--dim:#8b95ab;--faint:#5a6478;--hi:#e6a23c}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}svg{width:100%;height:100%;cursor:grab}header{position:absolute;z-index:4;top:0;left:0;right:0;padding:18px 20px;background:linear-gradient(#0b0e13f2,#0b0e1300);pointer-events:none}h1{font:600 15px monospace;margin:0 0 3px}.sub,.hint{font:12px monospace;color:var(--faint)}.chips{position:absolute;z-index:5;top:70px;left:20px;display:flex;gap:6px;flex-wrap:wrap;max-width:70vw}.chip{font:12px monospace;border:1px solid var(--border);background:var(--panel);padding:5px 10px;border-radius:20px;cursor:pointer}.chip.off{opacity:.35}.sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}.hint{position:absolute;bottom:15px;left:20px;z-index:4}.panel{position:absolute;z-index:8;right:0;top:0;width:360px;max-width:90vw;height:100%;padding:24px;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:.2s;overflow:auto}.panel.open{transform:none}.panel button{float:right;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer}.panel .cat{font:11px monospace;text-transform:uppercase}.panel h2{font:600 18px monospace;margin:14px 0}.panel p{color:var(--dim);line-height:1.55}.rel{font:12px monospace;color:var(--dim);padding:7px 0;border-top:1px solid var(--border);cursor:pointer}.link{stroke:#2a3345;stroke-width:1.1}.node circle{stroke:var(--bg);stroke-width:1.5}.label{fill:var(--dim);font:9.5px monospace}.dim{opacity:.12}.hi circle{stroke:#fff;stroke-width:2}.link.hi{stroke:var(--hi);stroke-width:1.8}</style></head><body><div id="app"><header><h1>Agent Lab Architecture Graph · V2</h1><div class="sub">Projeção visual oficial do PROJECT_COMPASS · baseline 438 · pós-Issue #77</div></header><div class="chips"></div><svg></svg><div class="panel"><button>×</button><div class="cat"></div><h2></h2><p></p><div class="rels"></div></div><div class="hint">scroll = zoom · arraste nó = fixar · clique fundo = limpar seleção</div></div><script>/* Projeção visual oficial: interpreta a arquitetura integrada; não cria verdade arquitetural. Em divergência, código/testes/SPECs/PROJECT_COMPASS prevalecem. */const D=window.AGENT_LAB_GRAPH,C=D.cats,N=D.nodes,L=D.links,svg=d3.select("svg"),g=svg.append("g"),gl=g.append("g"),gn=g.append("g"),gt=g.append("g"),panel=d3.select(".panel");const zoom=d3.zoom().scaleExtent([.2,4]).on("zoom",e=>g.attr("transform",e.transform));svg.call(zoom);const size={root:16,fluxo:10,modulo:6.5,contrato:7,evento:6,invariante:6};const sim=d3.forceSimulation(N).force("link",d3.forceLink(L).id(d=>d.id).distance(60).strength(.5)).force("charge",d3.forceManyBody().strength(-145)).force("center",d3.forceCenter(innerWidth/2,innerHeight/2)).force("collide",d3.forceCollide().radius(d=>size[d.cat]+13));const link=gl.selectAll("line").data(L).join("line").attr("class","link");const node=gn.selectAll("g").data(N).join("g").attr("class","node").call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",e=>{if(!e.active)sim.alphaTarget(0)}));node.append("circle").attr("r",d=>size[d.cat]).attr("fill",d=>C[d.cat].color).attr("fill-opacity",.88);const lab=gt.selectAll("text").data(N).join("text").attr("class","label").attr("text-anchor","middle").text(d=>d.label.length>31?d.label.slice(0,29)+"…":d.label);sim.on("tick",()=>{link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);node.attr("transform",d=>`translate(${d.x},${d.y})`);lab.attr("x",d=>d.x).attr("y",d=>d.y+size[d.cat]+11)});let active=new Set(Object.keys(C));const chips=d3.select(".chips");Object.entries(C).forEach(([k,v])=>chips.append("div").attr("class","chip").style("color",v.color).html(`<span class=sw style="background:${v.color}"></span>${v.label}`).on("click",function(){active.has(k)?active.delete(k):active.add(k);d3.select(this).classed("off",!active.has(k));apply()}));function apply(){node.style("display",d=>active.has(d.cat)?null:"none");lab.style("display",d=>active.has(d.cat)?null:"none");link.style("display",d=>active.has(d.source.cat)&&active.has(d.target.cat)?null:"none")}function select(d){const ids=new Set([d.id]);L.forEach(x=>{if(x.source.id===d.id)ids.add(x.target.id);if(x.target.id===d.id)ids.add(x.source.id)});node.classed("dim",x=>!ids.has(x.id)).classed("hi",x=>x.id===d.id);lab.classed("dim",x=>!ids.has(x.id));link.classed("dim",x=>x.source.id!==d.id&&x.target.id!==d.id).classed("hi",x=>x.source.id===d.id||x.target.id===d.id);panel.classed("open",true);panel.select(".cat").text(C[d.cat].label).style("color",C[d.cat].color);panel.select("h2").text(d.label);panel.select("p").text(d.info||"");const rel=L.filter(x=>x.source.id===d.id||x.target.id===d.id).map(x=>x.source.id===d.id?x.target:x.source);const box=panel.select(".rels").html("");rel.forEach(x=>box.append("div").attr("class","rel").text(x.label).on("click",()=>select(x)))}function clear(){node.classed("dim hi",false);lab.classed("dim",false);link.classed("dim hi",false);panel.classed("open",false)}node.on("click",(e,d)=>{e.stopPropagation();select(d)});svg.on("click",clear);panel.select("button").on("click",clear);addEventListener("resize",()=>{sim.force("center",d3.forceCenter(innerWidth/2,innerHeight/2));sim.alpha(.3).restart()});</script></body></html>
