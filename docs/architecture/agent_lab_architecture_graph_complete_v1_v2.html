,{"source":"release_v010","target":"phase_v2","kind":"evolution"}]};
const CATS=DATA.cats,NODES=DATA.nodes,LINKS=DATA.links;
const svg=d3.select("#svg"),g=svg.append("g"),linkLayer=g.append("g"),nodeLayer=g.append("g"),labelLayer=g.append("g");
const width=()=>innerWidth,height=()=>innerHeight;
const zoom=d3.zoom().scaleExtent([.15,4]).on("zoom",e=>g.attr("transform",e.transform)); svg.call(zoom);
const size={root:16,fase:13,fluxo:10,estrutura:5.8,modulo:6.3,contrato:6.7,marco:5.8,invariante:5.8,pressao:7};
const phaseX=d=>d.phase==="v1"?width()*.28:d.phase==="v2"?width()*.68:d.phase==="pressure"?width()*.83:width()*.50;
const catY=d=>({root:.47,fase:.47,fluxo:.47,estrutura:.30,modulo:.48,contrato:.60,marco:.72,invariante:.82,pressao:.23}[d.cat]||.5)*height();
const sim=d3.forceSimulation(NODES)
 .force("link",d3.forceLink(LINKS).id(d=>d.id).distance(d=>d.kind==="phase"?95:d.kind==="evolution"?55:68).strength(d=>d.kind==="cross"?.18:.42))
 .force("charge",d3.forceManyBody().strength(d=>d.cat==="root"?-380:d.cat==="fase"?-280:-135))
 .force("x",d3.forceX(phaseX).strength(.08))
 .force("y",d3.forceY(catY).strength(.055))
 .force("collide",d3.forceCollide().radius(d=>(size[d.cat]||6)+15));

 .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",e=>{if(!e.active)sim.alphaTarget(0)}));
node.append("circle").attr("r",d=>size[d.cat]||6).attr("fill",d=>CATS[d.cat].color).attr("fill-opacity",d=>d.cat==="root"||d.cat==="fase"?1:.86);

 .text(d=>d.label.length>34?d.label.slice(0,32)+"…":d.label);

let activeCats=new Set(Object.keys(CATS)); let preset="v2";

Object.entries(CATS).forEach(([k,v])=>chips.append("div").attr("class","chip active").style("color",v.color)
 .html(`<span class="sw" style="background:${v.color}"></span>${v.label}`).on("click",function(){
   if(activeCats.has(k))activeCats.delete(k);else activeCats.add(k);d3.select(this).classed("active",activeCats.has(k)).classed("off",!activeCats.has(k));apply();
 }));
function phaseVisible(d){
 if(preset==="all")return true;
 if(preset==="macro")return ["root","fase","fluxo","pressao"].includes(d.cat);
 if(preset==="v1")return d.phase==="v1"||d.phase==="shared"||d.id==="root"||d.id==="phase_v1";
 if(preset==="v2")return d.phase==="v2"||d.phase==="shared"||d.phase==="pressure"||d.id==="root"||d.id==="phase_v2";
 return true;
}
function visibleNode(d){return activeCats.has(d.cat)&&phaseVisible(d)}
function apply(){
 node.style("display",d=>visibleNode(d)?null:"none");labels.style("display",d=>visibleNode(d)?null:"none");
 link.style("display",d=>visibleNode(d.source)&&visibleNode(d.target)?null:"none");
 const count=NODES.filter(visibleNode).length; d3.select("#status").text(`${count}/${NODES.length} nós visíveis · ${LINKS.length} conexões totais`);
}
d3.selectAll("#presets .btn").on("click",function(){
 preset=this.dataset.preset;d3.selectAll("#presets .btn").classed("active",false);d3.select(this).classed("active",true);apply();setTimeout(fitVisible,120);
});
function neighbors(d){const s=new Set([d.id]);LINKS.forEach(l=>{if(l.source.id===d.id)s.add(l.target.id);if(l.target.id===d.id)s.add(l.source.id)});return s}
const panel=d3.select("#panel");
function selectNode(d){
 const nb=neighbors(d);node.classed("dim",n=>!nb.has(n.id)).classed("hi",n=>n.id===d.id);labels.classed("dim",n=>!nb.has(n.id));
 link.classed("dim",l=>l.source.id!==d.id&&l.target.id!==d.id).classed("hi",l=>l.source.id===d.id||l.target.id===d.id);
 panel.classed("open",true);panel.select(".cat").text(CATS[d.cat].label+(d.phase==="pressure"?" · NÃO IMPLEMENTADO":"")).style("color",CATS[d.cat].color);
 panel.select("h2").text(d.label);panel.select("p").text(d.info||"");
 const rel=LINKS.filter(l=>l.source.id===d.id||l.target.id===d.id).map(l=>l.source.id===d.id?l.target:l.source);
 const box=panel.select(".rels").html("");rel.forEach(n=>box.append("div").attr("class","rel").text(n.label).on("click",()=>selectNode(n)));
}
function clearSelection(){node.classed("dim hi",false);labels.classed("dim",false);link.classed("dim hi",false);panel.classed("open",false)}
node.on("click",(e,d)=>{e.stopPropagation();selectNode(d)});svg.on("click",clearSelection);panel.select(".close").on("click",clearSelection);
function fitVisible(){
 const pts=NODES.filter(d=>visibleNode(d)&&Number.isFinite(d.x)&&Number.isFinite(d.y)); if(!pts.length)return;
 const minX=d3.min(pts,d=>d.x),maxX=d3.max(pts,d=>d.x),minY=d3.min(pts,d=>d.y),maxY=d3.max(pts,d=>d.y);
 const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),pad=110;
 const s=Math.min((width()-pad*2)/bw,(height()-pad*2)/bh,1.25);
 const tx=width()/2-s*(minX+maxX)/2,ty=height()/2-s*(minY+maxY)/2;
 svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(s));
}
sim.on("end",()=>fitVisible());setTimeout(fitVisible,1800);apply();
addEventListener("resize",()=>{sim.force("x",d3.forceX(phaseX).strength(.08)).force("y",d3.forceY(catY).strength(.055));sim.alpha(.3).restart();setTimeout(fitVisible,450)});
